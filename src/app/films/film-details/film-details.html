<section class="film-details">
  <button type="button" (click)="goBack()">Back</button>

  @if (film) {
    <div class="film-details__layout">
      <img class="film-details__poster" [src]="film!.posterUrl" [alt]="film!.title" />

      <div class="film-details__info">
        <h1>{{ film!.title }}</h1>

        <p>{{ film!.year }} · {{ film!.genre }}</p>
        <p>Rating: {{ film!.rating }}</p>
        <p>Duration: {{ film!.duration }} min</p>

        <p class="film-details__description">
          {{ film!.description }}
        </p>
      </div>
    </div>
  } @else {
    <p>Film not found</p>
  }
</section>
