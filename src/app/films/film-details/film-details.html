<section class="film-details">
  <button type="button" (click)="goBack()">Back</button>

  @if (film(); as film) {
    <div class="film-details-layout">
      <img class="film-details-poster" [src]="film.posterUrl" [alt]="film.title" />

      <div class="film-details-info">
        <h1>{{ film.title }}</h1>

        <p>{{ film.year }} · {{ film.genre }}</p>
        <p>Rating: {{ film.rating }}</p>
        <p>Duration: {{ film.duration | duration }}</p>

        <p class="film-details-description">
          {{ film.description }}
        </p>

        <button
          type="button"
          class="film-details-favorite"
          [class.active]="film.isFavorite"
          (click)="toggleFavorite()"
        >
          ❤ {{ film.isFavorite ? 'Saved' : 'Add to favorites' }}
        </button>
      </div>
    </div>
  } @else {
    <p>Film not found</p>
  }
</section>
