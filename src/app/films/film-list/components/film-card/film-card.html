<div class="filmCard" (click)="onCardClick()">
  <img class="filmCard-poster" [src]="film.posterUrl" [alt]="film.title" />

  <div class="filmCard-body">
    <h2 class="filmCard-title">{{ film.title }}</h2>
    <p class="filmCard-meta">{{ film.year }} · {{ film.genre }}</p>
    <p class="filmCard-rating">Rating: {{ film.rating }}</p>

    <button type="button" class="filmCard-card-favorite" (click)="onFavoriteClick($event)">
      {{ film.isFavorite ? 'Remove from favorites' : 'Add to favorites' }}
    </button>
  </div>
</div>
